name: SupportHub CI/CD & Automated Unit Testing

on:
  push:
    branches: [ "main" ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ "main" ]

jobs:
  test-and-validate:
    name: 🧪 Unit Tests & Code Validation
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout do Código Fonte
        uses: actions/checkout@v4

      - name: 🟢 Configurar Node.js (v22)
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'npm'

      - name: 📦 Instalar Dependências
        run: npm ci

      - name: 🧪 Executar Suíte de Testes Unitários (Segurança & Autenticação)
        run: npm run test

      - name: 🔍 Checagem Estática de Tipagem (TypeScript Typecheck)
        run: npm run typecheck

      - name: ⚙️ Executar Build de Produção (Vite + Server Esbuild)
        run: npm run build

      - name: 🐳 Validar Sintaxe e Build dos Containers Docker
        run: |
          docker compose -f docker/docker-compose.yml config
          docker build -t supporthub-backend-test -f docker/Dockerfile.backend .
          docker build -t supporthub-frontend-test -f docker/Dockerfile.frontend .
