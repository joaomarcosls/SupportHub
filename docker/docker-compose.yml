services:
  # ---------------------------------------------------------------------------
  # 1. Banco de Dados Relacional - PostgreSQL
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: supporthub_postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-supporthub_db}
      POSTGRES_USER: ${POSTGRES_USER:-supporthub_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-SupporthubSecure2026!Pass}
    ports:
      - "5435:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../schema.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-supporthub_user} -d ${POSTGRES_DB:-supporthub_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # 2. Servidor Backend RESTful API - Node.js Express (Build via Git Clone)
  # ---------------------------------------------------------------------------
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
      args:
        REPO_URL: ${REPO_URL:-https://github.com/joaomarcosls/SupportHub.git}
        BRANCH_VERSION: ${BRANCH_VERSION:-main}
        GIT_AUTH_TOKEN: ${GIT_AUTH_TOKEN:-}
    container_name: supporthub_backend
    restart: always
    environment:
      NODE_ENV: production
      PORT: 3000
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-supporthub_db}
      POSTGRES_USER: ${POSTGRES_USER:-supporthub_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-SupporthubSecure2026!Pass}
      JWT_SECRET: ${JWT_SECRET:-super_secret_jwt_key_supporthub_2026}
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "3000"

  # ---------------------------------------------------------------------------
  # 3. Interface Frontend - React + Nginx (Build via Git Clone)
  # ---------------------------------------------------------------------------
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        REPO_URL: ${REPO_URL:-https://github.com/joaomarcosls/SupportHub.git}
        BRANCH_VERSION: ${BRANCH_VERSION:-main}
        GIT_AUTH_TOKEN: ${GIT_AUTH_TOKEN:-}
    container_name: supporthub_frontend
    restart: always
    ports:
      - "8383:80"
    depends_on:
      - backend

volumes:
  postgres_data:
    driver: local

networks:
  default:
    name: supporthub_network
